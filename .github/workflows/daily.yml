name: BUK AI - darmowe zestawienie dzienne
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python generate.py
      - run: python check_sources.py
      - name: Zapisz wynik do repozytorium
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/daily.json data/sources.json
          git diff --cached --quiet || (git commit -m 'Aktualizacja dziennego zestawienia' && git push)
